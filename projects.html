<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dawn's personal portfolio - projects and work">
  <meta name="theme-color" content="#ff5b9e">
  <title>dawn :3 - projects</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js" defer></script>
</head>

<body id="top">
  <!-- Decorative background -->
  <div class="bg-scene" aria-hidden="true">
    <div class="clouds"></div>
    <div class="hearts"></div>
    <div class="sparkles"></div>
  </div>

  <!-- Navigation -->
  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a href="index.html" class="logo" aria-label="Dawn's homepage">
        <span class="logo-icon" aria-hidden="true">♥</span>
        <span class="logo-text">dawn :3</span>
      </a>
      
      <nav role="navigation" aria-label="Main navigation">
        <a href="index.html#interests">Interests</a>
        <a href="projects.html" aria-current="page">Projects</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="container">
    <section class="section-animate" aria-labelledby="projects-title">
      <h1 class="section-title" id="projects-title">my projects</h1>
      
      <!-- Category Filters -->
      <div class="category-filter" role="group" aria-label="Filter projects by category">
        <button class="filter-btn active" data-category="all">all</button>
        <button class="filter-btn" data-category="design">design</button>
        <button class="filter-btn" data-category="sports">sports</button>
        <button class="filter-btn" data-category="science">science</button>
      </div>

      <!-- Projects Grid -->
      <div class="projects-grid" role="list">
        <!-- Your project cards here -->
        <!-- ... rest of your project cards ... -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer section-animate" role="contentinfo">
    <div class="container footer-content">
      <div class="footer-text">dawn • i love men</div>
      <a href="#top" class="footer-link" aria-label="Back to top of page">
        back up ↑
      </a>
    </div>
  </footer>

  <!-- Background Music -->
  <audio id="backgroundMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Music Player Controls -->
  <div id="musicPlayer" class="music-player" aria-label="Music controls">
    <button id="playPauseBtn" class="music-btn playing" aria-label="Play/Pause music">
      <iconify-icon icon="mdi:play" class="play-icon" aria-hidden="true"></iconify-icon>
      <iconify-icon icon="mdi:pause" class="pause-icon" aria-hidden="true"></iconify-icon>
    </button>
    <div class="music-info">
      <div class="music-title">vibes</div>
      <div class="volume-control">
        <iconify-icon icon="mdi:volume-high" aria-hidden="true"></iconify-icon>
        <input type="range" id="volumeSlider" min="0" max="100" value="50" aria-label="Volume control">
        <span id="volumePercent" class="volume-percent">50%</span>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="main.js" defer></script>
</body>
</html>
